services:
  - type: web
    name: asista-backend
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: asista-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "asista-backend.onrender.com"

databases:
  - name: asista-db
    databaseName: asistaapp
    user: asistauser
